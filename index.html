<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קאל פאל">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>קאל פאל</title>
<style>
:root{
  --bg:#0a0a0b; --s1:#151517; --s2:#1e1e21; --s3:#2a2a2e;
  --line:rgba(255,255,255,.08); --tx:#f5f5f7; --mut:#9b9ba3; --dim:#6e6e76;
  --cal:#ff8a3d; --pro:#4da3ff; --carb:#4cd08a; --fat:#ff6b9a; --fib:#b28cff; --over:#ff5a4f;
  --on-accent:#1a0d02; --blur:rgba(21,21,23,.72);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Heebo",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f2f2f4; --s1:#ffffff; --s2:#f0f0f3; --s3:#e2e2e7;
    --line:rgba(0,0,0,.08); --tx:#111114; --mut:#66666f; --dim:#9a9aa3;
    --cal:#e5620f; --pro:#2b7de9; --carb:#1f9d63; --fat:#d6336c; --fib:#7c5cd6; --over:#d92d20;
    --on-accent:#ffffff; --blur:rgba(255,255,255,.78);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--font);font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:none;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;font-size:16px;color:var(--tx);font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--cal);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.press{transition:transform 140ms var(--ease-out),background-color 140ms}
.press:active{transform:scale(.97)}

/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 0 10px;min-height:76px}
.hdr h1{margin:0;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.hdr .sub{color:var(--mut);font-size:14px;margin-top:4px}
.pill{background:var(--s1);border-radius:100px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--cal);min-height:36px}

/* week strip */
.week{display:flex;align-items:center;gap:2px;margin:2px -6px 14px}
.wnav{width:30px;height:44px;display:grid;place-items:center;color:var(--mut);flex:none}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px;min-height:64px}
.day .wd{font-size:12px;color:var(--mut)}
.day .rg{position:relative;width:36px;height:36px}
.day .rg svg{width:36px;height:36px;display:block}
.day .rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600}
.day.sel{background:var(--s1)}
.day.sel .wd{color:var(--tx)}
.day.tod .rg b{color:var(--cal)}
.trk{fill:none;stroke:var(--s3);stroke-width:3.5}
.prg{fill:none;stroke:var(--cal);stroke-linecap:round;stroke-width:3.5}
.prg.over{stroke:var(--over)}

/* hero */
.card{background:var(--s1);border-radius:24px;padding:20px 18px;margin-bottom:14px}
.hero{display:flex;flex-direction:column;align-items:center}
.bigring{position:relative;width:188px;height:188px}
.bigring svg{width:100%;height:100%;display:block}
.bigring .trk{stroke-width:13}
.bigring .prg{stroke-width:13;transition:stroke-dashoffset 600ms var(--ease-out),stroke 200ms}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid .n{font-size:48px;line-height:1;font-weight:700;letter-spacing:-.03em}
.mid .l{font-size:13px;color:var(--mut);margin-top:6px}
.mid.over .n{color:var(--over)}
.sums{display:flex;gap:28px;margin-top:14px;font-size:14px;color:var(--mut)}
.sums b{color:var(--tx);font-weight:600;margin-inline-start:4px}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.g{display:flex;flex-direction:column;align-items:center;text-align:center}
.g .rg{position:relative;width:58px;height:58px}
.g .rg svg{width:100%;height:100%;display:block}
.g .trk,.g .prg{stroke-width:5.5}
.g .prg{transition:stroke-dashoffset 600ms var(--ease-out)}
.g .rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:650;letter-spacing:-.01em}
.g .gn{font-size:13px;font-weight:600;margin-top:6px}
.g .gs{font-size:11.5px;color:var(--mut);margin-top:1px}

/* meals */
.meal{background:var(--s1);border-radius:20px;margin-bottom:12px;overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.mh .mi{width:32px;height:32px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--mut)}
.mh .mt{font-weight:650;font-size:16px;flex:1}
.mh .mk{color:var(--mut);font-size:14px}
.ent{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);min-height:56px}
.ent:active{background:var(--s2)}
.ent .n{font-size:15.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ent .d{font-size:12.5px;color:var(--mut);margin-top:3px}
.ent .c{font-weight:650;white-space:nowrap;font-size:16px}
.ent .c small{font-weight:400;color:var(--mut);font-size:11.5px;margin-inline-start:2px}
.ent.new{animation:enter 320ms var(--ease-out)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.addrow{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;border-top:1px solid var(--line);color:var(--cal);font-weight:600;font-size:15px;min-height:48px}

/* bars: tab + fab */
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  background:var(--blur);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--dim);padding:6px 0;min-height:48px;transition:color 150ms}
.tabs button.on{color:var(--cal)}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:19;display:flex;align-items:center;gap:8px;
  background:var(--cal);color:var(--on-accent);font-weight:700;font-size:16px;padding:0 20px 0 18px;height:52px;border-radius:26px;
  box-shadow:0 10px 30px -8px color-mix(in srgb,var(--cal) 70%,transparent),0 2px 6px rgba(0,0,0,.25)}
.fab svg.i{stroke-width:2.4}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity 220ms ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;margin:0 auto;max-width:560px;z-index:41;background:var(--s1);border-radius:26px 26px 0 0;
  display:flex;flex-direction:column;max-height:var(--sheet-max,92dvh);transform:translateY(102%);visibility:hidden;
  transition:transform 220ms var(--ease-out),visibility 0s 220ms;box-shadow:0 -20px 60px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none;visibility:visible;transition:transform 380ms var(--ease-drawer),visibility 0s}
.grab{touch-action:none;padding:8px 18px 4px;flex:none}
.grab .bar{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 8px}
.gt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.gt h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.gt .sb{font-size:13px;color:var(--mut);font-weight:400;margin-top:2px}
.ib{width:36px;height:36px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--mut);flex:none}
.hbtns{display:flex;gap:8px}
.fixd{padding:6px 18px 8px;flex:none}
.shb{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 18px 20px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:14px;padding:0 14px;height:46px;color:var(--mut)}
.sbox input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0;color:var(--tx)}
.sbox input::placeholder{color:var(--dim)}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;margin-top:10px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mut);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;transition:background-color 160ms,color 160ms}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.seg.meals button{flex-direction:column;gap:2px;font-size:12px;min-height:52px;padding:6px 2px}
.sec{font-size:13px;font-weight:600;color:var(--mut);margin:18px 2px 4px}
.fi{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);min-height:58px}
.fi:active{background:var(--s2)}
.fi .n{font-size:15.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fi .n mark{background:none;color:var(--cal);font-weight:650}
.fi .d{font-size:12.5px;color:var(--mut);margin-top:3px}
.fi .k{font-weight:650;white-space:nowrap;text-align:left}
.fi .k small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.tag{font-size:11px;font-weight:600;color:var(--cal);background:color-mix(in srgb,var(--cal) 16%,transparent);padding:1px 7px;border-radius:6px;margin-inline-start:6px;vertical-align:1px}
.empty{color:var(--mut);font-size:14px;padding:26px 6px;text-align:center;line-height:1.6}
.lab{display:block;font-size:13px;color:var(--mut);margin:16px 2px 6px}
.inp{width:100%;background:var(--s2);border:1.5px solid transparent;border-radius:12px;padding:0 14px;height:48px;outline:0;text-align:right;transition:border-color 150ms}
.inp:focus{border-color:var(--cal)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -18px;padding-inline:18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--s2);border-radius:100px;padding:0 15px;min-height:40px;font-size:14px;white-space:nowrap;display:flex;align-items:center;transition:background-color 160ms,color 160ms}
.chip.on{background:var(--cal);color:var(--on-accent);font-weight:650}
.stepper{display:flex;align-items:center;gap:10px;margin-top:10px}
.stepper .sb2{width:48px;height:48px;border-radius:14px;background:var(--s2);display:grid;place-items:center;flex:none}
.stepper .field{flex:1;min-width:0;display:flex;align-items:center;background:var(--s2);border-radius:14px;height:48px;padding:0 14px;border:1.5px solid transparent}
.stepper .field:focus-within{border-color:var(--cal)}
.stepper input{flex:1;min-width:0;width:1px;background:none;border:0;outline:0;text-align:center;font-size:20px;font-weight:650;height:100%}
.stepper .un{color:var(--mut);font-size:14px;white-space:nowrap}
.pv{background:var(--s2);border-radius:20px;padding:16px;margin-top:14px}
.pv .top{display:flex;align-items:baseline;justify-content:center;gap:6px}
.pv .top b{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.03em}
.pv .top span{color:var(--mut);font-size:14px}
.pv .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px;text-align:center}
.pv .row4 b{display:block;font-size:17px;font-weight:650}
.pv .row4 span{font-size:11.5px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:5px}
.pv .row4 i{width:7px;height:7px;border-radius:50%;display:inline-block}
.pv .gr{text-align:center;color:var(--mut);font-size:12.5px;margin-top:10px;min-height:18px}
.pv .gr.warn{color:var(--over);font-weight:600}
.src{font-size:12px;color:var(--mut);margin-top:10px;text-align:center}
.btn{width:100%;background:var(--cal);color:var(--on-accent);font-weight:700;font-size:17px;border-radius:16px;min-height:54px;margin-top:18px;text-align:center}
.btn.gh{background:var(--s2);color:var(--tx);font-weight:600;font-size:15.5px;min-height:48px;margin-top:10px}
.btn.dg{background:none;color:var(--over);font-weight:600;font-size:15.5px;min-height:48px;margin-top:4px}
.hint{font-size:12.5px;color:var(--mut);line-height:1.55;margin-top:8px}
.hint.warn{color:var(--cal)}

/* grouped lists (settings/history) */
.grp{background:var(--s1);border-radius:20px;margin-bottom:16px;overflow:hidden}
.grp h3{margin:0;padding:16px 16px 4px;font-size:17px;font-weight:650}
.grp .ht{padding:0 16px 10px;font-size:12.5px;color:var(--mut);line-height:1.55}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:56px;border-top:1px solid var(--line);width:100%}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .rl{flex:1;font-size:16px}
.row input.gi{width:96px;height:40px;background:var(--s2);border:1.5px solid transparent;border-radius:10px;text-align:center;font-weight:650;outline:0}
.row input.gi:focus{border-color:var(--cal)}
.row .ru{width:36px;color:var(--mut);font-size:13px}
.row.btnrow{color:var(--tx);font-size:16px;justify-content:space-between}
.row.dng{color:var(--over)}
.pad{padding:12px 16px 16px;border-top:1px solid var(--line)}
.pad .two{margin-top:-6px}
details summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:16px;font-size:17px;font-weight:650;min-height:56px}
details summary::-webkit-details-marker{display:none}
details summary svg{transition:transform 200ms var(--ease-out);color:var(--mut)}
details[open] summary svg{transform:rotate(180deg)}
.res{margin-top:12px;background:var(--s2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.7}
.res b{font-weight:650}
.fdel{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line);min-height:58px}
.fdel .n{font-size:15px}
.fdel .d{font-size:12.5px;color:var(--mut)}

/* history */
.hs{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:16px 8px}
.hs b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hs span{font-size:12.5px;color:var(--mut)}
.chart{position:relative;height:184px;padding:14px 0 22px;margin:4px 0 0}
.plot{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
.gl{position:absolute;inset-inline:0;border-top:1.5px dashed var(--dim);pointer-events:none;opacity:.7}
.gl span{position:absolute;inset-inline-start:0;top:-19px;font-size:11.5px;color:var(--mut);background:var(--s1);padding:0 4px 0 0}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.col .b{width:100%;max-width:16px;border-radius:5px 5px 2px 2px;background:var(--cal);min-height:3px;transition:opacity 150ms,height 400ms var(--ease-out)}
.col .b.z{background:var(--s3)}
.col .b.o{background:var(--over)}
.plot.has-sel .col:not(.sel) .b{opacity:.45}
.col .x{position:absolute;bottom:-20px;font-size:10.5px;color:var(--mut)}
.col::before{content:"";position:absolute;inset:-6px -2px}
.detail{padding:14px 16px 16px;border-top:1px solid var(--line);font-size:14px}
.detail .dt{display:flex;justify-content:space-between;align-items:baseline;font-weight:650;font-size:16px}
.detail .st{color:var(--mut);font-size:13px;margin:4px 0 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 16px;border-top:1px solid var(--line);min-height:58px}
.hrow:active{background:var(--s2)}
.hrow .d{font-size:12.5px;color:var(--mut);margin-top:2px}
.hrow .v{font-weight:650;text-align:left}
.hrow .v small{display:block;font-weight:500;font-size:12px}
.hrow .over{color:var(--over)}

.toast{position:fixed;inset-inline:16px;margin:0 auto;max-width:420px;bottom:calc(140px + env(safe-area-inset-bottom));z-index:60;
  background:var(--tx);color:var(--bg);border-radius:16px;padding:0 8px 0 16px;min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:14.5px;font-weight:500;opacity:0;transform:translateY(10px) scale(.97);pointer-events:none;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{font-weight:700;color:var(--cal);padding:0 12px;min-height:44px}
html.sheet-open .toast{bottom:calc(24px + env(safe-area-inset-bottom))}
.loading{color:var(--mut);text-align:center;padding:28px}

@media (hover:hover) and (pointer:fine){
  .ent:hover,.fi:hover,.hrow:hover{background:var(--s2)}
  .chip:not(.on):hover{background:var(--s3)}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.sheet.on{transition:opacity 200ms ease,visibility 0s}
  .sheet{opacity:0}.sheet.on{opacity:1}
  .press:active{transform:none}
  .ent.new{animation:none}
  .bigring .prg,.g .prg,.col .b{transition:none}
}
@media (prefers-contrast:more){ :root{--line:rgba(128,128,128,.5)} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-cl" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-cr" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-journal" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r=".8"/></symbol>
    <symbol id="i-sunrise" viewBox="0 0 24 24"><path d="M12 4v3M5 8l2 2M19 8l-2 2M2 17h20M6.5 17a5.5 5.5 0 0111 0M8 21h8"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.5A8.5 8.5 0 1110.5 3.5a6.5 6.5 0 0010 10z"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24"><path d="M12 8c-1.2-1.6-3.7-2-5.5-.5C4.4 9.3 5 13.5 7 16.5c1.3 1.9 2.7 2.4 5 1.3 2.3 1.1 3.7.6 5-1.3 2-3 2.6-7.2.5-9C15.7 6 13.2 6.4 12 8z"/><path d="M12 8c0-2 1-3.500 2.800-4.500"/></symbol>
    <symbol id="i-down2" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-up2" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
  </defs>
</svg>

<div class="wrap" id="app"></div>
<button class="fab press" id="fab" data-act="add"><svg class="i"><use href="#i-plus"/></svg>הוסף אוכל</button>
<nav class="tabs" id="tabs" aria-label="ניווט ראשי">
  <button data-tab="today"><svg class="i"><use href="#i-journal"/></svg>היומן שלי</button>
  <button data-tab="hist"><svg class="i"><use href="#i-chart"/></svg>מגמות</button>
  <button data-tab="set"><svg class="i"><use href="#i-target"/></svg>יעדים ונתונים</button>
</nav>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="הוספת אוכל"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= נתונים: מאגר משרד הבריאות ================= */
const DB={ready:false,err:false,list:[],byId:new Map(),units:{},src:'',n:0};
const norm=s=>String(s).toLowerCase().replace(/["'`׳״’‘]/g,'').replace(/[,\/\-()]+/g,' ').replace(/\s+/g,' ').trim();
function loadDB(){
  DB.err=false;
  return fetch('foods.json').then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{
    DB.units=j.u;DB.src=j.src;DB.n=j.n;
    DB.list=j.f.map(r=>({id:'m'+r[0],name:r[1],cal:r[2],p:r[3],c:r[4],f:r[5],fib:r[6],
      units:r[7].map(u=>({l:j.u[u[0]],g:u[1]})),n:norm(r[1]),db:true}));
    DB.byId=new Map(DB.list.map(f=>[f.id,f]));
    DB.ready=true;
    if(sh&&sh.view==='search')fillList();
    if(tab==='set')render();
  }).catch(()=>{DB.err=true;if(sh&&sh.view==='search')fillList();});
}
/* מזונות נפוצים: קודים מהמאגר (מסוננים אם חסרים) */
const COMMON=[
 ['חלבונים',[805,873,655,1298,1347,1561,1574,500,494,15,530,542,472,8712]],
 ['פחמימות',[2721,2727,3459,3654,2773,8199,2826,1919,1995,1946,1657,1669]],
 ['ירקות ופירות',[3225,3201,3120,3250,3322,3223,3793,3663,3626,3612,3839,3807,3812]],
 ['שומנים ואגוזים',[4443,1815,1854,1843,1858,1898]],
 ['נשנושים ושתייה',[2581,4670,4644,4544,4500,4843,4918,4803,3148]]
];

/* ================= מצב ושמירה ================= */
const KEY='calpal.v2';
const defaults=()=>({goals:{cal:2000,p:150,c:220,f:65,fib:30},foods:[],log:{},recent:[],calc:{sex:'m',age:30,h:175,w:75,act:1.375,goal:0}});
let S=load();
function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!d){try{const o=JSON.parse(localStorage.getItem('calpal.v1'));if(o){d=o;d.recent=[];}}catch(e){}}
  const b=defaults();d=d||{};
  return {...b,...d,goals:{...b.goals,...d.goals},calc:{...b.calc,...d.calc}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ================= עזרים ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const r1=n=>Math.round(n*10)/10;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>=0?n:0;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ico=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const MEALS=[['b','ארוחת בוקר','sunrise','בוקר'],['l','ארוחת צהריים','sun','צהריים'],['d','ארוחת ערב','moon','ערב'],['s','נשנושים','apple','נשנוש']];
const WD=['א','ב','ג','ד','ה','ו','ש'];
const MACRO=[['p','חלבון','var(--pro)'],['c','פחמימות','var(--carb)'],['f','שומן','var(--fat)'],['fib','סיבים','var(--fib)']];
const tot=l=>l.reduce((a,e)=>({cal:a.cal+e.cal,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f,fib:a.fib+(e.fib||0)}),{cal:0,p:0,c:0,f:0,fib:0});
const defMeal=()=>{const h=new Date().getHours();return h<11?'b':h<16?'l':h<21?'d':'s';};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
let tab='today',cur=today0(),sh=null,ringMem={},lastAdded=null,histN=14,histSel=null;

function getFood(id){
  if(!id)return null;
  const c=S.foods.find(f=>f.id===id);if(c)return normFood(c);
  return DB.byId.get(id)||null;
}
function normFood(f){
  if(f.units)return f;
  return {...f,fib:f.fib||0,units:f.sv?[{l:f.sv.l,g:f.sv.g}]:[],n:norm(f.name)};
}
const allFoods=()=>[...S.foods.map(normFood),...DB.list];
function dayLabel(d){
  const diff=Math.round((d-today0())/864e5);
  return diff===0?'היום':diff===-1?'אתמול':diff===1?'מחר':d.toLocaleDateString('he-IL',{weekday:'long'});
}
const dateFull=d=>d.toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});

let tt;
function toast(msg,btn,fn){
  const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(btn?'<button>'+esc(btn)+'</button>':'');
  if(btn)t.querySelector('button').onclick=()=>{fn&&fn();t.classList.remove('on');};
  t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),btn?6000:2200);
}

/* ================= רינגים ================= */
function svgRing(id,pct,size,r,color,cls){
  const c=size/2,C=2*Math.PI*r,from=ringMem[id]!==undefined?ringMem[id]:pct;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${c}" cy="${c}" r="${r}"/>`+
    `<circle class="prg ${cls||''}" ${color?`style="stroke:${color}"`:''} data-rid="${id}" data-c="${C}" data-to="${pct}" cx="${c}" cy="${c}" r="${r}" `+
    `stroke-dasharray="${C}" stroke-dashoffset="${C*(1-from)}" transform="rotate(-90 ${c} ${c})"/></svg>`;
}
function animateRings(){
  const els=[...document.querySelectorAll('#app .prg[data-rid]')];
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    els.forEach(el=>{const to=+el.dataset.to,C=+el.dataset.c;el.style.strokeDashoffset=C*(1-to);});
  }));
  els.forEach(el=>{ringMem[el.dataset.rid]=+el.dataset.to;});
}

/* ================= מסכים ================= */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');});
  $('#fab').style.display=tab==='today'?'':'none';
  $('#app').innerHTML=tab==='today'?vToday():tab==='hist'?vHist():vSet();
  if(tab==='today')animateRings();
  if(tab==='set'){mHint();calcOut();}
}

function vToday(){
  const key=dk(cur),list=S.log[key]||[],t=tot(list),g=S.goals;
  const pct=g.cal?Math.min(t.cal/g.cal,1):0,over=g.cal&&t.cal>g.cal,left=Math.round(g.cal-t.cal);
  // רצועת שבוע
  const start=new Date(cur);start.setDate(start.getDate()-start.getDay());
  let days='';
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=dk(d),l=S.log[k]||[],c=tot(l).cal,p=g.cal?Math.min(c/g.cal,1):0;
    const isSel=k===key,isTod=k===dk(today0());
    days+=`<button class="day press ${isSel?'sel':''} ${isTod?'tod':''}" data-act="goday" data-d="${k}" aria-label="${dayLabel(d)} ${dateFull(d)}" ${isSel?'aria-pressed="true"':''}>
      <span class="wd">${WD[d.getDay()]}</span><span class="rg">${weekRing(p,g.cal&&c>g.cal)}<b>${d.getDate()}</b></span></button>`;
  }
  const meals=MEALS.map(([k,nm,ic])=>{
    const items=list.filter(e=>e.meal===k),mt=tot(items);
    return `<section class="meal" aria-label="${nm}"><div class="mh"><span class="mi">${ico(ic)}</span><span class="mt">${nm}</span><span class="mk">${items.length?Math.round(mt.cal)+' קק״ל':''}</span></div>
      ${items.map(e=>`<button class="ent ${e.id===lastAdded?'new':''}" data-act="edit" data-id="${e.id}"><div style="min-width:0"><div class="n">${esc(e.name)}</div>
        <div class="d">${e.g?r1(e.g)+' ג׳ · ':''}חלבון ${r1(e.p)} · פחמ׳ ${r1(e.c)} · שומן ${r1(e.f)}</div></div>
        <div class="c">${Math.round(e.cal)}<small>קק״ל</small></div></button>`).join('')}
      <button class="addrow press" data-act="add" data-meal="${k}">${ico('plus')}הוסף ל${nm.replace('ארוחת ','ארוחת ')}</button></section>`;
  }).join('');
  const gauges=MACRO.map(([k,nm,col])=>{
    const goal=g[k]||0,v=t[k],p=goal?Math.min(v/goal,1):0;
    return `<div class="g"><div class="rg">${svgRing('g-'+k,p,58,24,col)}<b>${Math.round(v)}</b></div><div class="gn">${nm}</div><div class="gs">מתוך ${goal} ג׳</div></div>`;
  }).join('');
  lastAdded=null;
  return `<header class="hdr"><div><h1>${dayLabel(cur)}</h1><div class="sub">${dateFull(cur)}</div></div>
    ${key!==dk(today0())?'<button class="pill press" data-act="today">חזרה להיום</button>':''}</header>
  <div class="week"><button class="wnav" data-act="wprev" aria-label="השבוע הקודם">${ico('back')}</button>${days}<button class="wnav" data-act="wnext" aria-label="השבוע הבא">${ico('cl')}</button></div>
  <section class="card hero" aria-label="סיכום יומי">
    <div class="bigring">${svgRing('cal',pct,188,80,'',over?'over':'')}
      <div class="mid ${over?'over':''}"><div class="n">${Math.abs(left)}</div><div class="l">${over?'קק״ל מעל היעד':'קק״ל נותרו'}</div></div></div>
    <div class="sums"><span>נאכלו<b>${Math.round(t.cal)}</b></span><span>יעד<b>${g.cal}</b></span></div>
    <div class="gauges">${gauges}</div>
  </section>${meals}`;
}
function weekRing(p,over){
  const r=15,C=2*Math.PI*r;
  return `<svg viewBox="0 0 36 36" aria-hidden="true"><circle class="trk" cx="18" cy="18" r="${r}"/><circle class="prg ${over?'over':''}" cx="18" cy="18" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 18 18)"/></svg>`;
}

function vHist(){
  const t0=today0(),days=[];
  for(let i=histN-1;i>=0;i--){const d=new Date(t0);d.setDate(d.getDate()-i);const l=S.log[dk(d)]||[];days.push({d,k:dk(d),l,t:tot(l)});}
  const goal=S.goals.cal||1,mx=Math.max(goal*1.25,...days.map(x=>x.t.cal));
  const filled=days.filter(x=>x.l.length);
  const avg=k=>filled.length?Math.round(filled.reduce((a,x)=>a+x.t[k],0)/filled.length):0;
  const within=filled.filter(x=>x.t.cal<=goal*1.05).length;
  const step=histN>14?5:histN>7?2:1;
  const cols=days.map((x,i)=>{
    const h=x.t.cal/mx*100,cls=x.l.length?(x.t.cal>goal*1.05?'o':''):'z';
    return `<button class="col ${x.k===histSel?'sel':''}" data-act="hsel" data-d="${x.k}" aria-label="${dateFull(x.d)}: ${Math.round(x.t.cal)} קק״ל"><div class="b ${cls}" style="height:${h}%"></div>${(days.length-1-i)%step===0?`<span class="x">${x.d.getDate()}</span>`:''}</button>`;
  }).join('');
  const sel=days.find(x=>x.k===histSel);
  const detail=sel?`<div class="detail"><div class="dt"><span>${dayLabel(sel.d)} · ${sel.d.toLocaleDateString('he-IL',{day:'numeric',month:'long'})}</span><span>${Math.round(sel.t.cal)} קק״ל</span></div>
    <div class="st">${!sel.l.length?'לא נרשם אוכל ביום הזה':sel.t.cal>goal*1.05?'מעל היעד ב-'+Math.round(sel.t.cal-goal)+' קק״ל':'בתוך היעד'}</div>
    <div class="pv" style="margin-top:0"><div class="row4">${MACRO.map(([k,nm,c])=>`<div><b>${Math.round(sel.t[k])}</b><span><i style="background:${c}"></i>${nm}</span></div>`).join('')}</div></div>
    <button class="btn gh press" data-act="goday" data-d="${sel.k}">פתח את היום</button></div>`:'';
  const rows=days.slice().reverse().filter(x=>x.l.length).map(x=>{
    const diff=Math.round(x.t.cal-goal),ov=x.t.cal>goal*1.05;
    return `<button class="hrow" data-act="goday" data-d="${x.k}"><div><div>${dayLabel(x.d)} · ${x.d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})}</div>
      <div class="d">חלבון ${Math.round(x.t.p)} · פחמ׳ ${Math.round(x.t.c)} · שומן ${Math.round(x.t.f)}</div></div>
      <div class="v">${Math.round(x.t.cal)}<small class="${ov?'over':''}">${ov?'+'+diff+' מעל היעד':'בתוך היעד'}</small></div></button>`;
  }).join('');
  return `<header class="hdr"><div><h1>מגמות</h1><div class="sub">קלוריות ליום מול היעד</div></div></header>
  <div class="seg" role="tablist" style="margin:0 0 14px">${[7,14,30].map(n=>`<button class="${histN===n?'on':''}" data-act="hn" data-n="${n}">${n} ימים</button>`).join('')}</div>
  <section class="grp"><div class="hs"><div><b>${avg('cal')}</b><span>ממוצע קק״ל</span></div><div><b>${avg('p')}</b><span>ממוצע חלבון</span></div><div><b>${within}/${filled.length}</b><span>ימים בתוך היעד</span></div></div>
    <div class="pad" style="padding-top:8px"><div class="chart"><div class="plot ${sel?'has-sel':''}"><div class="gl" style="bottom:${goal/mx*100}%"><span>יעד ${S.goals.cal}</span></div>${cols}</div></div>
    <div class="hint" style="margin-top:6px">הממוצעים מחושבים רק על ימים שנרשם בהם אוכל (${filled.length}). גע בעמודה לפירוט.</div></div>${detail}</section>
  <section class="grp"><h3>פירוט לפי יום</h3><div style="height:6px"></div>${rows||'<div class="pad"><div class="hint">עוד אין נתונים. הוסף אוכל ביומן והוא יופיע כאן.</div></div>'}</section>`;
}

function vSet(){
  const g=S.goals,c=S.calc,sel=(v,o)=>v==o?'selected':'';
  const goalRow=(k,nm,col,u)=>`<label class="row"><span class="dot" style="background:${col}"></span><span class="rl">${nm}</span><input class="gi" inputmode="numeric" data-goal="${k}" value="${g[k]}" aria-label="${nm}"><span class="ru">${u}</span></label>`;
  return `<header class="hdr"><div><h1>יעדים ונתונים</h1><div class="sub">מה אתה רוצה להשיג כל יום</div></div></header>
  <section class="grp"><h3>יעדים יומיים</h3><div class="ht">הערכים משפיעים על הטבעות והפסים ביומן.</div>
    ${goalRow('cal','קלוריות','var(--cal)','קק״ל')}${goalRow('p','חלבון','var(--pro)','ג׳')}${goalRow('c','פחמימות','var(--carb)','ג׳')}${goalRow('f','שומן','var(--fat)','ג׳')}${goalRow('fib','סיבים','var(--fib)','ג׳')}
    <div class="pad"><div class="hint" id="mhint" style="margin:0"></div></div></section>
  <section class="grp"><details><summary>מחשבון יעדים ${ico('down')}</summary><div class="pad" style="border-top:0;padding-top:0">
    <div class="hint" style="margin-top:0">חישוב לפי נוסחת Mifflin-St Jeor. זו הערכה כללית ואינה ייעוץ תזונתי. אם יש לך מצב רפואי, התייעץ עם דיאטן/ית.</div>
    <div class="two"><div><span class="lab">מין</span><select class="inp" data-calc="sex"><option value="m" ${sel(c.sex,'m')}>גבר</option><option value="f" ${sel(c.sex,'f')}>אישה</option></select></div>
      <div><span class="lab">גיל</span><input class="inp" inputmode="numeric" data-calc="age" value="${c.age}"></div>
      <div><span class="lab">גובה (ס״מ)</span><input class="inp" inputmode="numeric" data-calc="h" value="${c.h}"></div>
      <div><span class="lab">משקל (ק״ג)</span><input class="inp" inputmode="decimal" data-calc="w" value="${c.w}"></div></div>
    <span class="lab">רמת פעילות</span><select class="inp" data-calc="act">
      <option value="1.2" ${sel(c.act,1.2)}>יושבני, בלי אימונים</option><option value="1.375" ${sel(c.act,1.375)}>קלה, 1-3 אימונים בשבוע</option>
      <option value="1.55" ${sel(c.act,1.55)}>בינונית, 3-5 אימונים</option><option value="1.725" ${sel(c.act,1.725)}>גבוהה, 6-7 אימונים</option></select>
    <span class="lab">מטרה</span><select class="inp" data-calc="goal">
      <option value="-500" ${sel(c.goal,-500)}>ירידה במשקל (‎-500 קק״ל)</option><option value="0" ${sel(c.goal,0)}>שמירה על המשקל</option><option value="300" ${sel(c.goal,300)}>עלייה במסה (‎+300 קק״ל)</option></select>
    <div class="res" id="calcout"></div><button class="btn gh press" data-act="applycalc">השתמש בתוצאה כיעדים</button></div></details></section>
  <section class="grp"><h3>המזונות שלי</h3><div class="ht">מזונות שיצרת בעצמך. הם מופיעים בחיפוש עם תווית ״שלי״.</div>
    ${S.foods.length?S.foods.map(f=>`<div class="fdel"><button class="press" data-act="editfood" data-id="${f.id}" style="flex:1;min-width:0;text-align:right"><div class="n">${esc(f.name)}</div><div class="d">${f.cal} קק״ל ל-100 ג׳</div></button>
      <button class="ib press" data-act="delfood" data-id="${f.id}" aria-label="מחק את ${esc(f.name)}">${ico('trash')}</button></div>`).join(''):'<div class="pad"><div class="hint" style="margin:0">עוד לא יצרת מזונות משלך. אפשר להוסיף דרך ״הוסף אוכל״ ואז ״מזון חדש״.</div></div>'}</section>
  <section class="grp"><h3>מקור הנתונים</h3><div class="pad" style="border-top:0"><div class="hint" style="margin-top:0">${DB.ready?`המאגר כולל <b>${DB.n.toLocaleString('he-IL')}</b> מזונות. מקור: ${esc(DB.src)}.`:'טוען את מאגר המזונות…'}

/* ================= חיפוש ================= */
function highlight(name,toks){
  let out=esc(name);
  toks.forEach(t=>{
    if(!t)return;const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');
    out=out.replace(re,'<mark>$1</mark>');
  });
  return out;
}
function search(q){
  const toks=norm(q).split(' ').filter(Boolean);
  const res=[];
  for(const f of allFoods()){
    const n=f.n||norm(f.name);let ok=true,sc=0;
    for(const t of toks){
      const i=n.indexOf(t);
      if(i<0){ok=false;break;}
      sc+=(i===0||n[i-1]===' ')?0:25;sc+=i/6;
    }
    if(!ok)continue;
    sc+=n.length/8;if(!f.db)sc-=100;
    res.push([sc,f]);
  }
  res.sort((a,b)=>a[0]-b[0]);
  return {toks:q.trim().split(/\s+/).filter(Boolean),list:res.slice(0,60).map(x=>x[1])};
}
const foodRow=(f,toks)=>`<button class="fi" data-act="pick" data-id="${f.id}"><div style="min-width:0"><div class="n">${toks?highlight(f.name,toks):esc(f.name)}${f.db?'':'<span class="tag">שלי</span>'}</div>
  <div class="d">חלבון ${f.p} · פחמ׳ ${f.c} · שומן ${f.f}</div></div><div class="k">${f.cal}<small>קק״ל ל-100 ג׳</small></div></button>`;
function fillList(){
  const el=$('#flist');if(!el)return;
  const q=($('#q')?.value||'').trim();sh.q=q;
  if(DB.err&&!DB.ready&&!S.foods.length){el.innerHTML='<div class="empty">לא הצלחתי לטעון את מאגר המזונות. בדוק חיבור לאינטרנט.<br><button class="chip on press" style="margin:12px auto 0" data-act="retry">נסה שוב</button></div>';return;}
  if(!DB.ready&&!S.foods.length){el.innerHTML='<div class="loading">טוען מאגר מזונות…</div>';return;}
  if(q){
    const r=search(q);
    el.innerHTML=r.list.length?r.list.map(f=>foodRow(f,r.toks)).join(''):
      '<div class="empty">לא נמצא מזון בשם הזה.<br>נסה מילה אחרת, או צור מזון חדש.</div>';
    return;
  }
  let h='';
  const rec=S.recent.map(getFood).filter(Boolean);
  if(rec.length)h+='<div class="sec">אחרונים</div>'+rec.map(f=>foodRow(f)).join('');
  if(S.foods.length)h+='<div class="sec">המזונות שלי</div>'+S.foods.map(f=>foodRow(normFood(f))).join('');
  if(DB.ready)COMMON.forEach(([t,codes])=>{
    const fs=codes.map(c=>DB.byId.get('m'+c)).filter(Boolean);
    if(fs.length)h+=`<div class="sec">${t}</div>`+fs.map(f=>foodRow(f)).join('');
  });
  el.innerHTML=h;
}

function gramsNow(){const u=sh.u>=0?sh.food.units[sh.u]:null;return u?sh.q*u.g:sh.q;}

const atw=(p,c,f)=>Math.round(4*p+4*c+9*f);

/* גרירה לסגירה: מעקב 1:1, האצה והקרנת תנועה (apple-design) */
let drag=null;
const rubber=(o,d)=>{const c=.55;return (o*d*c)/(d+c*Math.abs(o));};
$('#sheet').addEventListener('pointerdown',e=>{
  if(!e.target.closest('.grab')||e.target.closest('button')||drag)return;
  const el=$('#sheet');
  drag={y0:e.clientY,y:0,pts:[[e.clientY,performance.now()]],id:e.pointerId,h:el.offsetHeight};
  el.setPointerCapture(e.pointerId);el.style.transition='none';
});
$('#sheet').addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dy=e.clientY-drag.y0;
  drag.y=dy>0?dy:-rubber(-dy,120);
  $('#sheet').style.transform=`translateY(${drag.y}px)`;
  drag.pts.push([e.clientY,performance.now()]);if(drag.pts.length>6)drag.pts.shift();
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const p=drag.pts,a=p[0],b=p[p.length-1],v=b[1]>a[1]?(b[0]-a[0])/(b[1]-a[1]):0; // px/ms
  const projected=drag.y+v*1000*.998/(1-.998)/1000;
  const el=$('#sheet');el.style.transition='';
  const dismiss=projected>drag.h*.4;
  drag=null;
  if(dismiss)closeSheet();else el.style.transform='';
}
$('#sheet').addEventListener('pointerup',endDrag);
$('#sheet').addEventListener('pointercancel',endDrag);

/* מקלדת וירטואלית ב-iOS: הגיליון נשאר מעל המקלדת */
function fitSheet(){
  const vv=window.visualViewport,el=$('#sheet');if(!vv){return;}
  const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
  el.style.bottom=kb+'px';
  el.style.setProperty('--sheet-max',Math.floor(vv.height*.94)+'px');
}
if(window.visualViewport){visualViewport.addEventListener('resize',fitSheet);visualViewport.addEventListener('scroll',fitSheet);}

function addEntry(e){const k=dk(cur);(S.log[k]=S.log[k]||[]).push(e);save();}
function findEntry(id){const l=S.log[dk(cur)]||[];const i=l.findIndex(x=>x.id===id);return {l,i};}
function mkEntry(food,g,meal,extra){
  const k=g/100;
  return {id:uid(),meal,name:food.name,g,cal:Math.round(food.cal*k),p:r1(food.p*k),c:r1(food.c*k),f:r1(food.f*k),fib:r1((food.fib||0)*k),
    per:{cal:food.cal,p:food.p,c:food.c,f:food.f,fib:food.fib||0},fid:food.id,...extra};
}
function removeWithUndo(id,msg){
  const {l,i}=findEntry(id);if(i<0)return;
  const [e]=l.splice(i,1);save();render();
  toast(msg,'בטל',()=>{const k=dk(cur);(S.log[k]=S.log[k]||[]).splice(Math.min(i,(S.log[k]||[]).length),0,e);save();render();});
}
function pickFood(f,meal){
  const hasU=f.units&&f.units.length;
  const pref=hasU?(f.units.findIndex(u=>/בינונית/.test(u.l))>=0?f.units.findIndex(u=>/בינונית/.test(u.l)):f.units.findIndex(u=>/^יחידה$|^פרוסה$|^כף$|^כוס$|^מנה$/.test(u.l))):-1;
  const ui=hasU?(pref>=0?pref:0):-1;
  openSheet({view:'amt',food:f,meal,u:ui,q:ui>=0?1:100});
}

document.addEventListener('click',ev=>{
  const tb=ev.target.closest('[data-tab]');
  if(tb){tab=tb.dataset.tab;ringMem={};render();window.scrollTo(0,0);return;}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset;
  switch(a){
    case 'goday':cur=fromKey(d.d);tab='today';ringMem={};render();window.scrollTo(0,0);break;
    case 'today':cur=today0();ringMem={};render();break;
    case 'wprev':cur.setDate(cur.getDate()-7);ringMem={};render();break;
    case 'wnext':cur.setDate(cur.getDate()+7);ringMem={};render();break;
    case 'hn':histN=+d.n;histSel=null;render();break;
    case 'hsel':histSel=histSel===d.d?null:d.d;render();break;
    case 'add':openSheet({view:'search',meal:d.meal||defMeal(),q:''});break;
    case 'close':closeSheet();break;
    case 'back':case 'vsearch':openSheet({view:'search',meal:sh.meal,q:''});break;
    case 'vmanual':openSheet({view:'manual',meal:sh.meal});break;
    case 'vnew':openSheet({view:'new',meal:sh.meal});break;
    case 'retry':loadDB();fillList();break;
    case 'pick':{const f=getFood(d.id);if(f)pickFood(f,sh.meal);break;}
    case 'meal':sh.meal=d.m;$('#mealseg').innerHTML=MEALS.map(m=>`<button class="${sh.meal===m[0]?'on':''}" role="radio" aria-checked="${sh.meal===m[0]}" data-act="meal" data-m="${m[0]}">${ico(m[2])}${m[3]}</button>`).join('');break;
    case 'unit':{
      const i=+d.i,f=sh.food,g=gramsNow();
      sh.u=i;sh.q=i>=0?1:Math.round(g)||100;
      document.querySelectorAll('#uchips .chip').forEach((c,k)=>c.classList.toggle('on',k===i+1));
      $('#qty').value=sh.q;$('#unl').textContent=i>=0?f.units[i].l:'גרם';updPrev();centerChip();break;
    }
    case 'step':{
      const st=sh.u>=0?.5:10,v=Math.max(0,r1(sh.q+(+d.d)*st));
      sh.q=v;$('#qty').value=v;updPrev();break;
    }
    case 'save':{
      if(!(sh.q>0)){toast('הזן כמות');break;}
      const f=sh.food,g=gramsNow(),u=sh.u>=0?f.units[sh.u]:null;
      const ex=u?{ui:sh.u,ug:u.g,uq:sh.q,ul:u.l}:{};
      if(sh.editId){
        const {l,i}=findEntry(sh.editId);if(i>=0){const e=mkEntry(f,g,sh.meal,ex);e.id=sh.editId;l[i]=e;save();}
        closeSheet();render();toast('השינויים נשמרו');
      }else{
        const e=mkEntry(f,g,sh.meal,ex);addEntry(e);lastAdded=e.id;
        if(f.id)S.recent=[f.id,...S.recent.filter(x=>x!==f.id)].slice(0,10);save();
        closeSheet();render();
        toast(`נוסף: ${Math.round(e.cal)} קק״ל`,'בטל',()=>{const {l,i}=findEntry(e.id);if(i>=0){l.splice(i,1);save();render();}});
      }
      break;
    }
    case 'savemanual':{
      const n=$('#mn').value.trim()||'פריט ידני',c=num($('#mc').value),p=num($('#mp').value),ch=num($('#mch').value),f=num($('#mf').value);
      if(!c&&!p&&!ch&&!f){toast('הזן ערכים');break;}
      const e={id:sh.editId||uid(),meal:sh.meal,name:n,g:null,cal:Math.round(c),p:r1(p),c:r1(ch),f:r1(f),fib:0,per:null};
      if(sh.editId){const {l,i}=findEntry(sh.editId);if(i>=0){l[i]=e;save();}closeSheet();render();toast('השינויים נשמרו');}
      else{addEntry(e);lastAdded=e.id;closeSheet();render();toast(`נוסף: ${Math.round(e.cal)} קק״ל`,'בטל',()=>{const {l,i}=findEntry(e.id);if(i>=0){l.splice(i,1);save();render();}});}
      break;
    }
    case 'savefood':{
      const n=$('#nn').value.trim();if(!n){toast('הזן שם למזון');break;}
      const c=num($('#nc').value);if(!c&&!num($('#np').value)&&!num($('#nch').value)&&!num($('#nf').value)){toast('הזן ערכים תזונתיים');break;}
      const vals={name:n,cal:c,p:num($('#np').value),c:num($('#nch').value),f:num($('#nf').value),fib:num($('#nfb').value)};
      const sg=num($('#nsg').value);const sv=sg?{l:$('#nsl').value.trim()||'מנה',g:sg}:null;
      if(sh.editFood&&sh.editFood.id){
        const i=S.foods.findIndex(x=>x.id===sh.editFood.id);
        if(i>=0){S.foods[i]={...S.foods[i],...vals,sv};save();}
        closeSheet();render();toast('השינויים נשמרו');
      }else{
        const f={id:'c'+uid(),...vals};if(sv)f.sv=sv;
        S.foods.unshift(f);save();pickFood(normFood(f),sh.meal);
      }
      break;
    }
    case 'editfood':{
      const f=S.foods.find(x=>x.id===d.id);if(!f)break;
      openSheet({view:'new',editFood:f});break;
    }
    case 'edit':{
      const {l,i}=findEntry(d.id);if(i<0)break;const e=l[i];
      if(e.per){
        const f=getFood(e.fid)||{id:e.fid,name:e.name,...e.per,units:e.ug?[{l:e.ul||'יחידה',g:e.ug}]:[],db:false};
        let u=-1,q=r1(e.g);
        if(e.ui!=null&&f.units[e.ui]&&f.units[e.ui].g===e.ug){u=e.ui;q=e.uq;}
        openSheet({view:'amt',editId:e.id,food:f,meal:e.meal,u,q});
      }else openSheet({view:'manual',editId:e.id,meal:e.meal,m:e});
      break;
    }
    case 'delent':{const id=sh.editId;closeSheet();removeWithUndo(id,'הפריט נמחק');break;}
    case 'delfood':if(confirm('למחוק את המזון מהרשימה שלי? פריטים שכבר נרשמו ביומן לא יימחקו.')){S.foods=S.foods.filter(f=>f.id!==d.id);S.recent=S.recent.filter(x=>x!==d.id);save();if(d.fromedit)closeSheet();render();}break;
    case 'applycalc':{const r=calcRes();S.goals={...S.goals,cal:r.cal,p:r.p,c:r.c,f:r.f};save();render();toast('היעדים עודכנו');break;}
    case 'export':{
      const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),a2=document.createElement('a');
      a2.href=URL.createObjectURL(blob);a2.download='calpal-backup-'+dk(new Date())+'.json';document.body.appendChild(a2);a2.click();a2.remove();break;
    }
    case 'import':$('#file').click();break;
    case 'reset':if(confirm('למחוק את כל הנתונים? אי אפשר לשחזר.')&&confirm('בטוח? כל היומן והיעדים יימחקו.')){S=defaults();save();render();}break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sh)closeSheet();});

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q')fillList();
  else if(t.id==='qty'){sh.q=num(t.value);updPrev();}
  else if(['mc','mp','mch','mf'].includes(t.id))manualHint();
  else if(['nc','np','nch','nf'].includes(t.id))newHint();
  else if(t.dataset.goal){S.goals[t.dataset.goal]=Math.round(num(t.value));save();mHint();}
  else if(t.dataset.calc){S.calc[t.dataset.calc]=t.dataset.calc==='sex'?t.value:num(t.value);save();calcOut();}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.calc){S.calc[t.dataset.calc]=t.dataset.calc==='sex'?t.value:num(t.value);save();calcOut();}
  if(t.id==='file'&&t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.goals||!d.log)throw 0;S={...defaults(),...d,goals:{...defaults().goals,...d.goals}};save();render();toast('הגיבוי נטען');}catch(e){toast('קובץ לא תקין');}};
    rd.readAsText(t.files[0]);
  }
});
$('#sheet').addEventListener('touchmove',e=>{
  if(e.target.closest('#flist')&&document.activeElement&&document.activeElement.id==='q')document.activeElement.blur();
},{passive:true});

function mHint(){
  const e=$('#mhint');if(!e)return;const g=S.goals,k=g.p*4+g.c*4+g.f*9;
  e.textContent=`הקלוריות שמתקבלות מהחלבון, הפחמימות והשומן שהגדרת: ${k}`+(g.cal&&Math.abs(k-g.cal)>g.cal*.08?`. זה שונה מיעד הקלוריות ב-${Math.abs(k-g.cal)}, כדאי לאזן.`:'.');
}
function calcRes(){
  const c=S.calc,bmr=10*c.w+6.25*c.h-5*c.age+(c.sex==='m'?5:-161);
  const cal=Math.round((bmr*c.act+ +c.goal)/10)*10;
  const p=Math.round(c.w*(c.goal<0?2:1.8)),f=Math.round(cal*.27/9),ch=Math.max(0,Math.round((cal-p*4-f*9)/4));
  return {bmr:Math.round(bmr),cal,p,c:ch,f};
}
function calcOut(){
  const e=$('#calcout');if(!e)return;const r=calcRes();
  e.innerHTML=`חילוף חומרים בסיסי: <b>${r.bmr}</b> קק״ל<br>מומלץ: <b>${r.cal}</b> קק״ל · חלבון <b>${r.p}</b> · פחמימות <b>${r.c}</b> · שומן <b>${r.f}</b> ג׳`;
}

/* ================= אתחול ================= */
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
render();
loadDB();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const show=w=>toast('גרסה חדשה זמינה','רענן',()=>w.postMessage('SKIP_WAITING'));
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w);});});
  }).catch(()=>{});
  // רענון רק כשמחליפים גרסה קיימת, לא בהתקנה הראשונה
  const hadController=!!navigator.serviceWorker.controller;
  let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl||!hadController)return;rl=true;location.reload();});
}
</script>
</body>
</html>
